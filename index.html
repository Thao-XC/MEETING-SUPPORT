<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Live Interpreter — EN → JA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8E0CE;
    --panel: #F6F2E7;
    --panel-border: #D6CBAE;
    --ink: #2C2718;
    --ink-soft: #6B644F;
    --ink-faint: #9B927A;
    --bronze: #7C6A44;
    --bronze-deep: #5E4F32;
    --error: #8C4A34;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-ja: 'Noto Serif JP', serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 28px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--panel-border);
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .direction {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .status {
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-faint);
  }

  .status.ready .dot { background: #4C7A4F; }
  .status.busy .dot { background: var(--bronze); }
  .status.error .dot { background: var(--error); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    padding: 22px 28px 28px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-label {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
  }

  .panel-body {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }

  #english {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    resize: none;
    font-family: var(--font-ui);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
  }

  #english:focus { outline: none; }

  #english::placeholder { color: var(--ink-faint); }

  #romaji {
    font-family: var(--font-ui);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }

  #japanese {
    font-family: var(--font-ja);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .placeholder-text {
    color: var(--ink-faint);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 400;
  }

  .err {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--error);
  }

  footer {
    text-align: center;
    padding: 0 20px 16px;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
  }

  @media (max-width: 860px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto auto;
    }
    #english { min-height: 90px; }
  }
</style>
</head>
<body>

<header>
  <h1>Live Interpreter</h1>
  <div class="direction">English → 日本語 (romaji + kanji, side by side)</div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Loading dictionary…</span></div>
</header>

<main>
  <div class="panel">
    <div class="panel-label"><span>English</span></div>
    <div class="panel-body">
      <textarea id="english" placeholder="Type in English…" disabled></textarea>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label"><span>Romaji</span></div>
    <div class="panel-body">
      <div id="romaji"><span class="placeholder-text">Romaji will appear here</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-label"><span>日本語 (DeepL)</span></div>
    <div class="panel-body">
      <div id="japanese"><span class="placeholder-text">Japanese translation will appear here</span></div>
    </div>
  </div>
</main>

<footer>Enter translates immediately · otherwise it auto-translates ~0.5s after you stop typing</footer>

<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.1.2/dist/kuroshiro.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
<script>
  const englishEl = document.getElementById('english');
  const romajiEl = document.getElementById('romaji');
  const japaneseEl = document.getElementById('japanese');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  let kuroshiro = null;
  let romajiReady = false;
  let debounceTimer = null;
  let requestSeq = 0; // guards against out-of-order responses overwriting newer ones

  function setStatus(mode, text) {
    statusEl.className = 'status' + (mode ? ' ' + mode : '');
    statusText.textContent = text;
  }

  async function initRomaji() {
    // Unlock typing no matter what happens with the dictionary download —
    // it can be slow or occasionally stall on the CDN, and that should
    // never leave the page unusable. Translation works with or without romaji.
    const unlockTimer = setTimeout(() => {
      if (!romajiReady) {
        setStatus('error', 'Romaji is taking too long — translation only for now');
        englishEl.disabled = false;
      }
    }, 15000);

    try {
      kuroshiro = new Kuroshiro();
      const analyzer = new KuromojiAnalyzer({ dictPath: 'https://unpkg.com/kuromoji@0.1.2/dict/' });
      await kuroshiro.init(analyzer);
      clearTimeout(unlockTimer);
      romajiReady = true;
      setStatus('ready', 'Ready');
      englishEl.disabled = false;
      englishEl.focus();
    } catch (e) {
      clearTimeout(unlockTimer);
      console.error(e);
      setStatus('error', 'Romaji unavailable — translation only');
      englishEl.disabled = false;
    }
  }

  initRomaji();

  englishEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    if (!englishEl.value.trim()) {
      resetOutputs();
      return;
    }
    debounceTimer = setTimeout(translate, 500);
  });

  englishEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      clearTimeout(debounceTimer);
      translate();
    }
  });

  function resetOutputs() {
    romajiEl.innerHTML = '<span class="placeholder-text">Romaji will appear here</span>';
    japaneseEl.innerHTML = '<span class="placeholder-text">Japanese translation will appear here</span>';
  }

  async function translate() {
    const text = englishEl.value.trim();
    if (!text) { resetOutputs(); return; }

    const seq = ++requestSeq;
    setStatus('busy', 'Translating…');

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (seq !== requestSeq) return; // a newer request has since started
      if (!res.ok) throw new Error(data.error || 'Translation failed');

      const japanese = data.translation || '';
      japaneseEl.textContent = japanese;

      if (romajiReady && japanese) {
        try {
          const romaji = await kuroshiro.convert(japanese, { to: 'romaji', mode: 'spaced', romajiSystem: 'hepburn' });
          if (seq !== requestSeq) return;
          romajiEl.textContent = romaji;
        } catch (e) {
          if (seq === requestSeq) romajiEl.innerHTML = '<span class="placeholder-text">Romaji unavailable</span>';
        }
      } else {
        romajiEl.innerHTML = '<span class="placeholder-text">Romaji unavailable</span>';
      }
      setStatus('ready', 'Ready');
    } catch (e) {
      if (seq !== requestSeq) return;
      japaneseEl.innerHTML = `<span class="err">${escapeHtml(e.message || 'Something went wrong.')}</span>`;
      romajiEl.innerHTML = '';
      setStatus('error', 'Error');
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>

</body>
</html>
